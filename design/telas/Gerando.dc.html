body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#2A1F1F;background:#F4EEEC}
.fd{font-family:'Fredoka','Nunito',system-ui,sans-serif}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(-2deg)}}
@keyframes drift{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-60px);opacity:0}}
@keyframes shine{0%{transform:translateX(-80px)}100%{transform:translateX(320px)}}
@keyframes grow{0%{width:52%}100%{width:68%}}
@keyframes cycle{0%,3%{opacity:0;transform:translateY(8px)}8%,30%{opacity:1;transform:translateY(0)}35%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes think{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
.book{animation:float 2.6s ease-in-out infinite}
.s1{animation:drift 3s ease-out infinite}.s2{animation:drift 3s 1s ease-out infinite}.s3{animation:drift 3s 2s ease-out infinite}
.shine{animation:shine 1.8s ease-in-out infinite}
.grow{animation:grow 3s ease-out both}
.p1{animation:cycle 7.5s infinite}.p2{animation:cycle 7.5s 2.5s infinite}.p3{animation:cycle 7.5s 5s infinite}
.spin{animation:spin 1s linear infinite}
.think{animation:think 3s ease-in-out infinite;transform-origin:50% 100%}
</style>
