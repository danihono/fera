# Publica a versão web do app no GitHub Pages (branch gh-pages) a cada push na main.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Antes de publicar: tipos, lint e os testes da linha de montagem da IA (sem chamar IA nenhuma).
      - run: npx tsc --noEmit && npx tsc --noEmit -p tests
      - run: npx expo lint
      - run: npm run test:ia
      - name: Cloud Functions compilam
        run: npm --prefix functions ci && npm --prefix functions run typecheck && npm --prefix functions run build
      # A config do Firebase vem do .env do repositório (é pública).
      - run: npx expo export --platform web
      # Site: /fera/ = moldura de celular (web/index.html) e /fera/app/ = o app (baseUrl /fera/app).
      # _expo/ começa com "_": sem .nojekyll o Pages ignora a pasta.
      # 404.html = index do app, para as rotas do Expo Router abrirem direto.
      - run: |
          mkdir site
          mv dist site/app
          cp web/index.html site/index.html
          cp site/app/index.html site/404.html
          touch site/.nojekyll
      - name: Publicar no gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
